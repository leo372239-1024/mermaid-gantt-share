name: 更新 deadlines.json / deadlines.ics

# deadlines.json 与 deadlines.ics 都是从 gantt.md + js/events.js + js/ics.js 派生出来的产物。
# 本工作流保证它们在三种时机保持最新：
#   1) 数据源发生 push 时（改完甘特图立即生效）
#   2) 每天定时两次（让 daysLeft / hoursLeft / within24h 这类「相对今天」的字段翻新）
#   3) 手动触发（workflow_dispatch）
#
# 注意：定时任务用 UTC 表达。
#   22:00 UTC = 次日 06:00 北京时间
#   10:00 UTC = 当日 18:00 北京时间
# 每天两次是为了让 daysLeft / within24h 这类「相对今天」的字段不至于过时太久。

on:
  push:
    branches: [main]
    paths:
      - 'gantt.md'
      - 'js/events.js'
      - 'js/parser.js'
      - 'js/ics.js'
      - 'tools/build-deadlines.js'
      - '.github/workflows/update-deadlines.yml'
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deadlines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 deadlines.json 与 deadlines.ics
        run: node tools/build-deadlines.js

      - name: 提交变更（仅在内容有变化时）
        run: |
          if git diff --quiet -- deadlines.json deadlines.ics; then
            echo "deadlines.json / deadlines.ics 无变化，跳过提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deadlines.json deadlines.ics
          git commit -m "chore: 自动更新 deadlines.json / deadlines.ics [skip ci]"
          git push
